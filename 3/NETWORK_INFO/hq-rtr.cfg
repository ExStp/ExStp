!
no service password-encryption
!
hostname HQ-RTR.au-team.irpo
!
!
hw mgmt ip 192.168.255.1/24
!
bgp extended-asn-cap 
!
ip vrf management
!
class-map default
!
security default
!
security none vrf management
!
ip pool dhcp 1
 range 192.168.2.2-192.168.2.9
!
dhcp-server 1
 lease 86400
 dns 192.168.1.10
 domain-name au-team.irpo
 gateway 192.168.2.1
 mask 255.255.255.240
 static ip 192.168.2.10
  client-id mac 1111.1111.1111
 pool dhcp 64
!
mpls propagate-ttl
mpls label mode per-prefix
mpls exp stack-size all
!
ip domain-lookup
ip domain-name au-team.irpo
ip name-server 192.168.1.10
!
!
ip pim register-rp-reachability
!
router ospf 1
 passive-interface default
 no passive-interface tunnel.1
 network 192.168.1.0/26 area 0.0.0.0
 network 192.168.2.0/28 area 0.0.0.0
 network 192.168.5.0/30 area 0.0.0.0
 network 192.168.99.0/29 area 0.0.0.0
!
ip route 0.0.0.0/0 172.16.4.1 description default
!
line con 0
line vty 0 871
!
ntp timezone utc+3
!
port te0
 mtu 9728
 service-instance te0/isp-hq
  encapsulation untagged
!
port te1
 mtu 9728
 service-instance te1/srv-net
  encapsulation dot1q 100
  rewrite pop 1
 service-instance te1/cli-net
  encapsulation dot1q 200
  rewrite pop 1
 service-instance te1/management
  encapsulation dot1q 999
  rewrite pop 1
!
interface tunnel.1
 ip mtu 1476
 ip address 192.168.5.1/30
 ip tunnel 172.16.4.4 172.16.5.5 mode gre
 ip ospf authentication
 ip ospf authentication-key 0x76dd931c4978660b
!
interface isp-hq
 ip mtu 1500
 connect port te0 service-instance te0/isp-hq
 ip nat outside
 ip address 172.16.4.4/28
!
interface srv-net
 ip mtu 1500
 connect port te1 service-instance te1/srv-net
 ip nat inside
 ip address 192.168.1.1/26
!
interface cli-net
 ip mtu 1500
 connect port te1 service-instance te1/cli-net
 dhcp-server 1
 ip nat inside
 ip address 192.168.2.1/28
!
interface management
 ip mtu 1500
 connect port te1 service-instance te1/management
 ip address 192.168.99.1/29
!
ip nat source static tcp 192.168.1.10 80 172.16.4.4 80
!
ip nat pool nat 192.168.1.1-192.168.2.254,192.168.99.0-192.168.99.254
!
ip nat source dynamic inside-to-outside pool nat overload interface isp-hq
!
arp request-interval 1
arp request-number 3
arp expiration-period 5
arp solicitation-rate 2
arp ip-collision-time 8
arp incomplete-time 60
!
end