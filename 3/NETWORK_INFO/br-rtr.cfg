!
no service password-encryption
!
hostname BR-RTR.au-team.irpo
!
!
hw mgmt ip 192.168.255.1/24
!
virtual-router VR_ROUTER
!
bgp extended-asn-cap 
!
ip vrf management
!
class-map default
!
security-profile 1
!
security default
!
security none vrf management
!
mpls propagate-ttl
mpls label mode per-prefix
mpls exp stack-size all
!
ip domain-lookup
ip domain-name au-team.irpo
ip name-server 192.168.1.10
!
!
ip pim register-rp-reachability
!
router ospf 1
 passive-interface default
 no passive-interface tunnel.1
 network 192.168.3.0/27 area 0.0.0.0
 network 192.168.5.0/30 area 0.0.0.0
!
ip route 0.0.0.0/0 172.16.5.1 description default
!
line con 0
line vty 0 39
!
ntp timezone utc+3
!
port te0
 mtu 9728
 service-instance te0/isp-br
  encapsulation untagged
!
port te1
 mtu 9728
 service-instance te1/br-net
  encapsulation untagged
!
interface tunnel.1
 ip mtu 1476
 ip address 192.168.5.2/30
 ip tunnel 172.16.5.5 172.16.4.4 mode gre
 ip ospf authentication
 ip ospf authentication-key 0x76dd931c4978660b
!
interface isp-br
 ip mtu 1500
 connect port te0 service-instance te0/isp-br
 ip nat outside
 ip address 172.16.5.5/28
!
interface br-net
 ip mtu 1500
 connect port te1 service-instance te1/br-net
 ip nat inside
 ip address 192.168.3.1/27
!
interface int0
 ip mtu 1500
!
ip nat source static tcp 192.168.3.10 8080 172.16.5.5 80
!
ip nat pool nat 192.168.3.1-192.168.3.254
!
ip nat source dynamic inside-to-outside pool nat overload interface isp-br
!
arp request-interval 1
arp request-number 3
arp expiration-period 5
arp solicitation-rate 2
arp ip-collision-time 8
arp incomplete-time 60
!
end