services:
  wiki:
    container_name: wiki
    image: mediawiki
    restart: always
    ports:
      - "8080:80"
    volumes:
      - /root/LocalSettings.php:/var/www/html/LocalSettings.php
  mariadb:
    container_name: mariadb
    image: mariadb
    restart: always
    environment:
      MARIADB_DATABASE: mediawiki
      MARIADB_PASSWORD: WikiP@ssw0rd
      MARIADB_USER: wiki
      MARIADB_ROOT_PASSWORD: WikiP@ssw0rd
    volumes:
      - mariadb_data:/var/lib/mysql
volumes:
  mariadb_data: